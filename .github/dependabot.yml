version: 2

# One grouped PR per ecosystem. Dependabot groups cannot span ecosystems, so
# this is the coarsest grouping available. Splitting bumps across PRs is not
# just noise: a lone github/codeql-action/init bump leaves `analyze` behind and
# the action aborts on mismatched versions.
updates:
  # Actions are pinned to commit SHAs, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Base images in the Dockerfile are pinned by digest. Keep them on plain FROM
  # lines; Dependabot silently ignores images behind `FROM ${ARG}`.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Digest refreshes on the current tag are the point of this ecosystem: they
    # are what keeps the Trivy gate green. A Python minor bump is a different
    # thing entirely and must never land on its own. Dependabot can only see
    # the runtime `FROM python:3.12-...` line, not the builder's
    # ghcr.io/astral-sh/uv:python3.12-bookworm-slim tag, so it proposes moving
    # the runtime alone -- which ships a 3.12 venv into a 3.15 interpreter and
    # breaks the image. Moving Python means changing both FROM lines,
    # requires-python, and the python-version pins in the workflows together.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
