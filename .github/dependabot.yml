version: 2

# One grouped PR per ecosystem. Dependabot groups cannot span ecosystems, so
# this is the coarsest grouping available. Splitting bumps across PRs is not
# just noise: a lone github/codeql-action/init bump leaves `analyze` behind and
# the action aborts on mismatched versions.
updates:
  # Actions are pinned to commit SHAs, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Base images in the Dockerfile are pinned by digest. Keep them on plain FROM
  # lines; Dependabot silently ignores images behind `FROM ${ARG}`.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
