version: 2
updates:
  # Actions are pinned to commit SHAs, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly

  # Base images in the Dockerfile are pinned by digest.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
